id: coingecko-crypto
title: CoinGecko — top-100 cryptocurrencies by market cap
category: reference
version: "1.0"

description: >
  Snapshot of the top-100 cryptocurrencies ranked by market capitalization
  at install time, from CoinGecko's free public API. One row per coin
  carrying price, market cap, 24h change, supply figures, and the
  all-time-high price + date. Refreshable at any time via
  HITORRO_DATASETS_FORCE=1.

  First financial dataset in the catalog. No relationships declared —
  cryptos don't join to any of the geographic / socioeconomic datasets
  via a shared identifier. Interesting on its own for time-series and
  ranking queries, and could bridge to news / regulatory datasets later.

license:
  spdx: LicenseRef-CoinGecko-Free
  attribution: "CoinGecko"
  commercialUse: true
  redistribution: true
  attributionRequired: true
  shareAlike: false
  modification: true

source:
  type: http
  url: https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1
  format: json
  checksum: null

record:
  type: finance.CryptoAsset
  primaryKey: coin_id
  fields:
    - { name: coin_id,                 type: core_string, role: id,                     description: "CoinGecko id — canonical slug (bitcoin, ethereum, ...)" }
    - { name: symbol,                  type: core_string, role: "id.ticker",            description: "Trading ticker (btc, eth, ...)" }
    - { name: name,                    type: core_string, role: name }
    - { name: current_price_usd,       type: core_double, role: "metric.price" }
    - { name: market_cap_usd,          type: core_double, role: "metric.market_cap" }
    - { name: market_cap_rank,         type: core_long }
    - { name: price_change_24h_pct,    type: core_double,                                description: "Percentage change over the last 24h, at snapshot time" }
    - { name: total_volume_usd,        type: core_double,                                description: "24h trading volume in USD" }
    - { name: circulating_supply,      type: core_double }
    - { name: total_supply,            type: core_double,                                description: "Nullable — some coins have no cap" }
    - { name: max_supply,              type: core_double,                                description: "Nullable — same" }
    - { name: ath_usd,                 type: core_double,                                description: "All-time-high price (USD)" }
    - { name: ath_date,                type: core_string,                                description: "ISO-8601 UTC datetime of ATH" }
    - { name: last_updated,            type: core_string,                                description: "ISO-8601 UTC timestamp of the source datum" }

provides:
  - metric.price
  - metric.market_cap

identifiers:
  produces:
    - coingecko_id
    - ticker
  maps: []

partitionBy: null

# No cross-dataset relationships today. Cryptos don't share an identifier
# with the geographic / socioeconomic datasets.
relationships: []

metadata:
  useCases:
    - "Live snapshot of the top-100 crypto by market cap"
    - "Rank changes over multiple installs — save a copy, install again, diff"
    - "24-hour price movers (biggest gainers / losers, sorted)"
    - "'How much of the top-100 is stablecoin?' — filter by ticker in USDT/USDC/DAI/etc"
  methodology: >
    CoinGecko aggregates prices and volumes from ~500 exchanges,
    weighted for liquidity. Market cap = circulating supply × price;
    coins with unverifiable circulating supply are excluded. Free tier
    has a soft rate limit (~10-30 req/min) and requires attribution;
    the install script fetches ONE page of 100 coins per invocation.
  stats:
    rowCount: 100
    sizeBytes: 32768
    refreshCadence: "on-demand (source updates every ~60 seconds; re-install to refresh)"
    coverage: "Top 100 coins globally by market cap. Excludes stables that fail liquidity gates and NFT/token wrappers."
  furtherReading: "https://docs.coingecko.com/reference/coins-markets"
