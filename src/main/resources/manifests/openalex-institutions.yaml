id: openalex-institutions
title: OpenAlex — top research institutions
category: scholarly
version: "1.0"

description: >
  Top 500 research institutions worldwide by cited-by-count, from the
  OpenAlex public API. Universities, national labs, hospitals, industry
  research arms. One HTTP call at install time — the API returns full
  metadata for the sorted top-N in a single request.

  Fields: OpenAlex ID, ROR identifier, display name, ISO country, city,
  works count, citation count, homepage. CC0.

  First scholarly-research dataset in the catalog. Extends the country
  identifier graph into a new domain: "papers written in high-emission
  countries", "citation footprint per capita", "which universities
  cluster in cities with the highest GDP per capita" — all become
  reachable with USING PLACE joins through wikidata-countries.

license:
  spdx: CC0-1.0
  attribution: "OpenAlex"
  commercialUse: true
  redistribution: true
  attributionRequired: false
  shareAlike: false
  modification: true

source:
  type: http
  url: https://api.openalex.org/institutions?per-page=200&sort=cited_by_count:desc
  format: json
  checksum: null

record:
  type: research.Institution
  primaryKey: openalex_id
  fields:
    - { name: openalex_id,     type: core_string, role: id,                 description: "OpenAlex I-id" }
    - { name: ror_id,          type: core_string, role: "id.ror",           description: "Research Organization Registry id" }
    - { name: display_name,    type: core_string, role: name }
    - { name: country_code,    type: core_string, role: "id.iso3166alpha2" }
    - { name: city,            type: core_string,                           description: "City where the institution is headquartered" }
    - { name: institution_type, type: core_string,                          description: "education | company | facility | government | healthcare | archive | ..." }
    - { name: works_count,     type: core_long,   role: "metric.works" }
    - { name: cited_by_count,  type: core_long,   role: "metric.citations" }
    - { name: homepage_url,    type: core_string }

provides:
  - metric.works
  - metric.citations

identifiers:
  produces:
    - openalex_institution
    - ror
  maps:
    - iso3166alpha2

partitionBy: null

relationships:
  - target: wikidata-countries
    kind: EXACT_ID
    via: [country_code]

  - target: geonames-country-info
    kind: EXACT_ID
    via: [country_code]

  - target: natural-earth-countries
    kind: EXACT_ID
    via: [country_code]

  # No direct edge to worldbank-indicators — country_code is ISO-2 and
  # wb.iso_a3 is ISO-3, so a direct join would return zero rows. Include
  # wikidata-countries explicitly in the query (it speaks both ISO forms)
  # and the rewriter chains: o.country_code = wc.iso_a2, then
  # wc.iso_a3 = wb.iso_a3.
  #
  # Same rule applies for any other iso3-keyed target (owid-co2-latest,
  # future World Bank time-series): route through wikidata-countries or
  # geonames-country-info as the hub.

metadata:
  useCases:
    - "Top research institutions by citation count worldwide"
    - "Country research footprint (institutions + citations per country)"
    - "'Which cities host the most-cited universities?'"
    - "Baseline for future joins to individual works / authors when those datasets land"
  methodology: >
    OpenAlex is a free scholarly search index started by OurResearch in
    2022, built on the retired Microsoft Academic Graph. It ingests
    Crossref, PubMed, ORCID, ROR, and institutional web crawls, then
    disambiguates authors and institutions using ML. Citation counts are
    the sum of citations to every work OpenAlex has associated with the
    institution — inflates for older, larger orgs. This dataset ships the
    top 400 by that metric.
  stats:
    rowCount: 400
    sizeBytes: 131072
    refreshCadence: "monthly (OpenAlex refreshes counts weekly; re-install to update)"
    coverage: "Global. Universities, national labs, hospitals, and industry R&D. Top by absolute citation count."
  furtherReading: "https://docs.openalex.org/api-entities/institutions"
