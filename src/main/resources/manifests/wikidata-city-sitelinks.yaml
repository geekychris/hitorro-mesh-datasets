id: wikidata-city-sitelinks
title: Wikidata — city → enwiki article-slug bridge
category: geographic
version: "1.0"

description: >
  Bridge dataset: for each Wikidata city with population > 100 000 (matches
  wikidata-cities), the URL slug of its English Wikipedia article. About
  2 000 rows. CC0. Turns wikipedia-pageviews (which is keyed on article
  slug) into a queryable geographic layer:

    "which of Wikipedia's top-viewed articles today are cities?"
    "how do city populations correlate with their Wikipedia readership?"

  Kept as its own manifest rather than added as a column to wikidata-cities
  so existing installs don't need a schema migration and users can install
  it independently if pageviews is the only downstream they care about.

license:
  spdx: CC0-1.0
  attribution: "Wikidata contributors"
  commercialUse: true
  redistribution: true
  attributionRequired: false
  shareAlike: false
  modification: true

source:
  type: sparql
  url: https://query.wikidata.org/sparql
  format: sparql-results+json
  checksum: null

record:
  type: media.SitelinkBridge
  primaryKey: wikidata_qid
  fields:
    - { name: wikidata_qid,    type: core_string, role: "id.wikidata",          description: "Wikidata Q identifier for the city" }
    - { name: enwiki_article,  type: core_string, role: "id.wikipedia_article", description: "URL slug — underscore-separated, matches wikipedia_pageviews.article" }
    - { name: enwiki_title,    type: core_string,                               description: "Display title — spaces instead of underscores" }
    - { name: enwiki_url,      type: core_string,                               description: "Full https://en.wikipedia.org/wiki/… URL" }

provides:
  - id.wikipedia_article

identifiers:
  produces:
    - wikipedia_article
  maps:
    - wikidata

partitionBy: null

relationships:
  # The whole point: wikidata_cities.wikidata_qid ↔ wc.wikidata_qid
  # (role: id on both sides) and wc.enwiki_article ↔ wp.article
  # (role: id.wikipedia_article — same on both).
  - target: wikidata-cities
    kind: EXACT_ID
    via: [wikidata_qid]

  - target: wikipedia-pageviews
    kind: EXACT_ID
    via: [enwiki_article]

metadata:
  useCases:
    - "'Which of today's top-viewed Wikipedia articles are cities?' — direct join"
    - "'How does city population correlate with Wikipedia readership?' — proxy for online attention vs demographic size"
    - "Anchor for future multilingual sitelink datasets (dewiki, eswiki, ...)"
  methodology: >
    SPARQL against query.wikidata.org for every Q515 (city) item with
    population > 100 000 that has a schema:isPartOf link to
    en.wikipedia.org. Sitelinks are Wikidata's canonical
    inter-project bridge — updated whenever a Wikipedia article
    is created, moved, or merged. Article slugs are URL-encoded
    (Li%C3%A8ge for Liège) to match Wikipedia's URL convention.
  stats:
    rowCount: 1546
    sizeBytes: 320000
    refreshCadence: "weekly (Wikipedia articles get created / moved constantly)"
    coverage: "Only cities with enwiki articles — about 70 % of Wikidata cities > 100k pop"
  furtherReading: "https://www.wikidata.org/wiki/Help:Sitelinks"
