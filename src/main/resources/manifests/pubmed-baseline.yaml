id: pubmed-baseline
title: NIH PubMed / MEDLINE annual baseline
category: scholarly
version: "1.0"
description: >
  Biomedical citations (title + abstract + authors + MeSH headings) from the
  annual NIH baseline. Default installs one baseline file (~30k citations,
  ~30MB); scale to the full ~30M-citation baseline via HITORRO_PUBMED_FILES.
