id: iso-639-3
title: ISO 639-3 — every language SIL knows (~8000)
category: codification
version: "1.0"
description: >
  Superset of ISO 639-1 (which is our iso-languages dataset with ~180
  entries). Includes constructed, ancient, and extinct languages
  alongside living ones. Sourced from SIL, the ISO 639-3
  registration authority.
