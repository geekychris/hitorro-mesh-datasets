id: wikipedia-pageviews
title: Wikipedia — top-1000 pageviews (English, most recent complete day)
category: scholarly
version: "1.0"

description: >
  Every article in the top 1 000 of English Wikipedia pageviews for the
  most recent complete UTC day, straight from Wikimedia's REST API. One
  row per article carrying rank, view count, and the article slug.
  Refreshable via HITORRO_DATASETS_FORCE=1.

  Not directly joinable to any other dataset by identifier — Wikipedia
  article titles rarely match structured labels exactly ("New_York_City"
  vs "New York City" is easy; "Ronaldo" vs Cristiano Ronaldo vs the
  Brazilian isn't). Use LIKE / REGEXP or substitute the wikidata sitelink
  join on a future iteration. Shipped now as a "zeitgeist" layer that's
  interesting on its own and shows the mesh happily handling non-
  identifier data.

license:
  spdx: CC-BY-SA-3.0
  attribution: "Wikimedia Foundation — pageview statistics"
  commercialUse: true
  redistribution: true
  attributionRequired: true
  shareAlike: true
  modification: true

source:
  type: http
  url: https://wikimedia.org/api/rest_v1/metrics/pageviews/top/en.wikipedia/all-access/{YYYY}/{MM}/{DD}
  format: json
  checksum: null

record:
  type: media.PageviewSummary
  primaryKey: article
  fields:
    - { name: article,   type: core_string, role: "id.wikipedia_article", description: "URL slug — underscore-separated title, matches wikidata-city-sitelinks.enwiki_article" }
    - { name: title,     type: core_string, role: name,              description: "Display title (spaces instead of underscores)" }
    - { name: view_rank, type: core_long,                            description: "Position in the top-1000 (1 = highest). Named view_rank rather than rank because `rank` is a Calcite reserved word (window function)." }
    - { name: views,     type: core_long,   role: "metric.pageviews", description: "Number of views on the sample day" }
    - { name: sample_date, type: core_string, role: "time.observed", description: "UTC date the top-1000 was sampled (YYYY-MM-DD)" }

provides:
  - metric.pageviews

identifiers:
  produces:
    - wikipedia_article
  maps: []

partitionBy: null

# Wikipedia articles don't declare a clean id namespace overlap with
# anything else in the catalog today. When wikidata sitelinks land as
# their own dataset, we'll add a probabilistic name-based relationship.
relationships: []

metadata:
  useCases:
    - "'What is the internet reading about today?' — top-1000 English Wikipedia articles"
    - "Zeitgeist / current-events layer for news and trend detection"
    - "Join with wikidata_city_sitelinks to see which cities are trending"
  methodology: >
    Wikimedia's public REST API aggregates pageview logs into per-hour
    and per-day summaries. This dataset pulls the top-1000 English
    Wikipedia articles for the most recent complete UTC day. Bot traffic
    is filtered out server-side (all-agents = human + spider requests,
    minus known bots). The endpoint typically lags ~24 hours behind
    real-time; the install script retries the last 5 days until one
    returns.
  stats:
    rowCount: 1000
    sizeBytes: 65536
    refreshCadence: "daily (source updates ~24-48h behind real-time; re-install to refresh)"
    coverage: "English Wikipedia only. First-page-view rank — everything at rank 1001+ is silently dropped"
  furtherReading: "https://www.mediawiki.org/wiki/Wikimedia_REST_API"
