# Curated list of cross-dataset joins that return real rows today.
# Each entry stays true as long as its listed datasets are installed
# and the mesh's SQL surface hasn't regressed. Adding a new win here
# should follow verifying it against a live mesh.
#
# Fields
# ------
# title:      short human sentence — what the join tells you
# datasets:   ids involved, in JOIN order
# kind:       exact-id | spatial | hub | mixed
# hops:       N — number of JOIN edges
# license:    combined-licence hint from LicenseAlgebra (permissive |
#             attribution-required | share-alike | non-commercial)
# sql:        the exact query. Use USING PLACE where the semantic
#             rewriter helps; otherwise raw ON clauses.
# semantic:   true if the query should be submitted with semantic=true
# note:       one-line "why is this interesting?" explanation

wins:
  - title: "Cities enriched with country socioeconomic stats"
    datasets: [wikidata-cities, wikidata-countries, worldbank-indicators]
    kind: hub
    hops: 2
    license: attribution-required
    semantic: true
    sql: |
      SELECT wd.name AS city, wd.population,
             wb.gdp_per_capita_usd, wb.life_expectancy_years
      FROM wikidata_cities wd
      JOIN wikidata_countries wc USING PLACE
      JOIN worldbank_indicators wb USING PLACE
      WHERE wd.population > 5000000
      ORDER BY wb.gdp_per_capita_usd DESC LIMIT 20
    note: |
      Two hops through the wikidata-countries hub — city → country QID
      → ISO alpha-3 → World Bank. Rewriter automatically chains through
      role-tagged identifier columns. Returns the "big rich cities" list
      including Singapore, NYC, London, Sydney.

  - title: "Top research institutions enriched with GDP per capita"
    datasets: [openalex-institutions, wikidata-countries, worldbank-indicators]
    kind: hub
    hops: 2
    license: attribution-required
    semantic: true
    sql: |
      SELECT o.display_name, o.city, o.cited_by_count, wb.gdp_per_capita_usd
      FROM openalex_institutions o
      JOIN wikidata_countries wc USING PLACE
      JOIN worldbank_indicators wb USING PLACE
      ORDER BY o.cited_by_count DESC LIMIT 10
    note: |
      Scholarly citation counts + national economic context in one query.
      CNRS (Paris, France, $49k/cap), Harvard (Cambridge, US, $90k/cap),
      Chinese Academy of Sciences (Beijing, China, $14k/cap), ...

  - title: "Which of yesterday's top Wikipedia articles are actually cities"
    datasets: [wikipedia-pageviews, wikidata-city-sitelinks, wikidata-cities]
    kind: exact-id
    hops: 2
    license: share-alike
    semantic: true
    sql: |
      SELECT wp.title, wp.views, wd.population, wd.country_iso
      FROM wikipedia_pageviews wp
      JOIN wikidata_city_sitelinks sl USING PLACE
      JOIN wikidata_cities wd USING PLACE
      ORDER BY wp.views DESC LIMIT 10
    note: |
      Zeitgeist meets geography. The wikidata-city-sitelinks bridge maps
      Wikipedia article slugs to Wikidata city QIDs. Yesterday's top-1000
      Wikipedia articles usually contain 2-10 cities.

  - title: "NOAA weather stations attributed to country + continent"
    datasets: [noaa-ghcnd-stations, geonames-country-info]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT s.name, s.elevation, ci.country, ci.continent
      FROM noaa_ghcnd_stations s
      JOIN geonames_country_info ci USING PLACE
      WHERE s.elevation > 4000
      ORDER BY s.elevation DESC LIMIT 15
    note: |
      Weather stations above 4000m — high-altitude monitoring. Joined
      via the derived fips_country column (first 2 chars of station_id
      match FIPS 10-4). Kazbek Mountain, Georgia at 5033m tops the list.

  - title: "High-altitude NOAA stations with country income group"
    datasets: [noaa-ghcnd-stations, wikidata-countries, natural-earth-countries]
    kind: hub
    hops: 2
    license: attribution-required
    semantic: true
    sql: |
      SELECT s.name AS station, s.elevation,
             ne.name AS country, ne.income_grp
      FROM noaa_ghcnd_stations s
      JOIN wikidata_countries wc USING PLACE
      JOIN natural_earth_countries ne USING PLACE
      WHERE s.elevation > 5000
    note: |
      Three-way through the country hub. NOAA carries FIPS,
      Natural Earth carries ISO alpha-2 — wikidata-countries bridges
      the two.

  - title: "Country-info enriched with currency symbol + minor units"
    datasets: [geonames-country-info, iso-currencies]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT ci.country, ci.capital,
             cur.alpha3, cur.name AS currency, cur.symbol, cur.minor_unit
      FROM geonames_country_info ci
      JOIN iso_currencies cur USING PLACE
      ORDER BY ci.country LIMIT 20
    note: |
      Small filler join with big UX return — every country gets its
      currency symbol + how many decimals to render. Foundational for
      any commerce / display layer.

  - title: "Wikidata cities in ODbL-share-alike-flagged airports countries"
    datasets: [osm-airports, wikidata-countries, wikidata-cities]
    kind: mixed
    hops: 2
    license: share-alike
    semantic: false
    sql: |
      SELECT a.name AS airport, a.iata_code, wc.name AS country
      FROM osm_airports a
      JOIN wikidata_countries wc ON a.country_code = wc.iso_a2
      WHERE wc.iso_a2 IN ('JP','FR','DE','GB')
      ORDER BY wc.name, a.iata_code LIMIT 20
    note: |
      First win that touches the ODbL dataset — LicenseAlgebra flags
      the result as share-alike. Only ~6 OSM airports have addr:country
      set (OSM tagging quirk), so this is the tip of the iceberg;
      SPATIAL rewriter will unlock the full set once mesh phase-4b lands.

  - title: "UN Least-Developed Countries with region context"
    datasets: [geonames-country-info, un-m49-areas]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT ci.country, ci.continent,
             m.sub_region_name, m.least_developed
      FROM geonames_country_info ci
      JOIN un_m49_areas m USING PLACE
      WHERE m.least_developed = true
      ORDER BY ci.country LIMIT 15
    note: |
      The 44 UN Least-Developed Countries listed with continent + UN
      sub-region. Afghanistan (South Asia), Angola (Sub-Saharan Africa
      / Middle Africa), Cambodia (South-eastern Asia), ... Rewriter
      joins ISO alpha-2 (ci.iso = m.iso2). First win that uses M49's
      development-status flags.

  - title: "World Bank indicators for UN Least-Developed Countries"
    datasets: [worldbank-indicators, un-m49-areas]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT wb.name, wb.gdp_per_capita_usd, wb.life_expectancy_years,
             m.region_name, m.sub_region_name
      FROM worldbank_indicators wb
      JOIN un_m49_areas m USING PLACE
      WHERE m.least_developed = true
      LIMIT 20
    note: |
      World Bank stats slice on the UN Least-Developed Country list.
      First query that uses M49's development classifications joined
      to actual economic indicators. Rewriter joins ISO alpha-3
      (wb.iso_a3 = m.iso3).

  - title: "High-altitude US weather stations enriched with state + region"
    datasets: [noaa-ghcnd-stations, us-states]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: false
    sql: |
      SELECT n.name, n.elevation,
             s.name AS state, s.region, s.division
      FROM noaa_ghcnd_stations n
      JOIN us_states s ON n.state = s.postal
      WHERE n.fips_country = 'US'
        AND n.elevation > 3000
      ORDER BY n.elevation DESC LIMIT 15
    note: |
      First us-states cross-dataset join to fire end-to-end. Adds
      state name + US Census region + division to every US weather
      station above 3000m. Mauna Kea (Hawaii / West), White Mtn
      (California / West / Pacific), Chepeta (Utah / West / Mountain),
      Red Cliff Pass (Colorado / West / Mountain), ... Uses the raw
      state postal-code equijoin — rewriter would pick this up too
      once us-states.postal + noaa.state get a shared role.

  # ────────────────────────────────────────────────────────────────────
  # Direct ISO-alpha-3 joins across country-shaped datasets
  # ────────────────────────────────────────────────────────────────────

  - title: "Emitters compared: CO2 next to GDP per capita"
    datasets: [worldbank-indicators, owid-co2-latest]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT wb.name, wb.gdp_per_capita_usd,
             co.co2_mt, co.co2_per_capita_t
      FROM worldbank_indicators wb
      JOIN owid_co2_latest co USING PLACE
      WHERE wb.gdp_per_capita_usd IS NOT NULL
      ORDER BY co.co2_per_capita_t DESC LIMIT 15
    note: |
      One JOIN gives you the classic emissions × wealth scatter dataset.
      Rewriter matches on ISO 3166-1 alpha-3 (wb.iso_a3 = co.iso_a3).
      No hub needed — both tables key on the same code.

  - title: "GDP for high-income OECD countries"
    datasets: [natural-earth-countries, worldbank-indicators]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT ne.name, ne.income_grp, wb.gdp_per_capita_usd
      FROM natural_earth_countries ne
      JOIN worldbank_indicators wb USING PLACE
      WHERE ne.income_grp LIKE '1.%'
      ORDER BY wb.gdp_per_capita_usd DESC LIMIT 15
    note: |
      Natural Earth carries a hand-classified income_grp column
      ("1. High income: OECD" / "2. High income: nonOECD" / ...).
      Filter to income group 1 then rank by real World Bank GDP.
      Luxembourg, Ireland, Switzerland, US usually top the list.

  - title: "CO2 across UN Least-Developed Countries"
    datasets: [owid-co2-latest, un-m49-areas]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT co.country, co.co2_per_capita_t, m.sub_region_name
      FROM owid_co2_latest co
      JOIN un_m49_areas m USING PLACE
      WHERE m.least_developed = true
      ORDER BY co.co2_per_capita_t DESC LIMIT 15
    note: |
      Slices CO2 data by the UN's Least-Developed Country flag —
      Angola, Bangladesh, Cambodia, ... each with their per-capita
      emissions and UN sub-region. Rewriter joins on iso3.

  - title: "High-income countries ranked by CO2 per capita"
    datasets: [natural-earth-countries, owid-co2-latest]
    kind: exact-id
    hops: 1
    license: attribution-required
    semantic: true
    sql: |
      SELECT ne.name, ne.income_grp, co.co2_per_capita_t
      FROM natural_earth_countries ne
      JOIN owid_co2_latest co USING PLACE
      WHERE ne.income_grp LIKE '1.%'
      ORDER BY co.co2_per_capita_t DESC LIMIT 10
    note: |
      Which of the world's high-income countries emit the most per
      person? Australia, US, Canada usually surface at the top;
      France + UK lower thanks to nuclear. Fires the same iso_a3
      matcher as CO2 × GDP but uses Natural Earth's own income tier.

  # ────────────────────────────────────────────────────────────────────
  # Three-way hub joins — a bridge dataset connects two orthogonal ones
  # ────────────────────────────────────────────────────────────────────

  - title: "OSM airports enriched with UN region + sub-region"
    datasets: [osm-airports, wikidata-countries, un-m49-areas]
    kind: hub
    hops: 2
    license: share-alike
    semantic: true
    sql: |
      SELECT a.name AS airport, a.iata_code,
             m.region_name, m.sub_region_name
      FROM osm_airports a
      JOIN wikidata_countries wc USING PLACE
      JOIN un_m49_areas m USING PLACE
      LIMIT 15
    note: |
      Two-hop through wikidata-countries — OSM's ISO alpha-2 → country
      QID → M49. Adds continent + UN sub-region to every airport
      without a separate lookup step. First win that combines an
      ODbL dataset (osm-airports) with M49 — LicenseAlgebra propagates
      share-alike through the result.

  - title: "OSM airports in high-GDP countries"
    datasets: [osm-airports, wikidata-countries, worldbank-indicators]
    kind: hub
    hops: 2
    license: share-alike
    semantic: true
    sql: |
      SELECT a.name AS airport, a.iata_code,
             wb.name AS country, wb.gdp_per_capita_usd
      FROM osm_airports a
      JOIN wikidata_countries wc USING PLACE
      JOIN worldbank_indicators wb USING PLACE
      WHERE wb.gdp_per_capita_usd > 40000
      ORDER BY wb.gdp_per_capita_usd DESC LIMIT 15
    note: |
      Three-way through the wikidata-countries hub. Only ~6 OSM
      airports have addr:country tags set — a known OSM tagging
      quirk — but the rewrite is exercised end-to-end and the
      share-alike propagation is visible in the result banner.

  - title: "Top research institutions grouped by UN region"
    datasets: [openalex-institutions, wikidata-countries, un-m49-areas]
    kind: hub
    hops: 2
    license: attribution-required
    semantic: true
    sql: |
      SELECT o.display_name, o.city, o.cited_by_count, m.region_name
      FROM openalex_institutions o
      JOIN wikidata_countries wc USING PLACE
      JOIN un_m49_areas m USING PLACE
      ORDER BY o.cited_by_count DESC LIMIT 15
    note: |
      Adds M49 region to the citation-ranked institution leaderboard —
      CNRS (Paris, Europe), Harvard (Cambridge MA, Americas), Chinese
      Academy of Sciences (Beijing, Asia). Sister query to the
      GDP-per-capita version (win #2); different enrichment axis.

  # ────────────────────────────────────────────────────────────────────
  # JVS-flavored: multi-value column filtering with LIKE / POSITION
  # ────────────────────────────────────────────────────────────────────
  # Many JVS datasets carry a "single column, comma-separated" list —
  # a legacy shape from source TSVs where one row is truly N values.
  # Until UNNEST support lands, LIKE '%<item>%' is the practical way to
  # query these fields. Not a JOIN in the traditional sense — a SET-
  # membership predicate on JVS's multi-value column pattern.

  - title: "Countries where English is a recognised language"
    datasets: [geonames-country-info]
    kind: multi-value
    hops: 0
    license: attribution-required
    semantic: false
    sql: |
      SELECT country, capital, languages
      FROM geonames_country_info
      WHERE languages LIKE '%en%'
      ORDER BY country LIMIT 20
    note: |
      GeoNames stores the languages column as a comma-separated list
      of BCP-47 tags ("en-US,es-US,haw,fr"). LIKE '%en%' is the JVS-
      idiomatic way to ask "does this row's multi-value list contain
      the token 'en'?" — until UNNEST/SPLIT operators land. Returns
      every country whose entry mentions any en-* variant.

  - title: "Countries bordering China"
    datasets: [geonames-country-info]
    kind: multi-value
    hops: 0
    license: attribution-required
    semantic: false
    sql: |
      SELECT country, capital, neighbours
      FROM geonames_country_info
      WHERE neighbours LIKE '%CN%'
      ORDER BY country LIMIT 15
    note: |
      neighbours is a comma-separated list of ISO-2 codes. LIKE '%CN%'
      finds every country whose neighbour set contains China.
      Afghanistan, Bhutan, India, Kazakhstan, Kyrgyzstan, Laos, ...
      Same JVS multi-value pattern as the language query.

  - title: "AI-tagged top GitHub repos"
    datasets: [github-top-repos]
    kind: multi-value
    hops: 0
    license: attribution-required
    semantic: false
    sql: |
      SELECT full_name, primary_language, stargazers_count
      FROM github_top_repos
      WHERE topics LIKE '%ai%'
      ORDER BY stargazers_count DESC LIMIT 15
    note: |
      GitHub topic tags land as one comma-separated string. LIKE '%ai%'
      picks up both explicit 'ai' tags and words containing 'ai'
      (fair-warning: this is a substring match, not a token match —
      that's the JVS multi-value tradeoff until proper array types
      arrive).

  - title: "HuggingFace transformer-library models with 10M+ downloads"
    datasets: [huggingface-top-models]
    kind: multi-value
    hops: 0
    license: attribution-required
    semantic: false
    sql: |
      SELECT model_id, downloads, pipeline_tag
      FROM huggingface_top_models
      WHERE library_name = 'transformers'
        AND downloads > 10000000
      ORDER BY downloads DESC LIMIT 15
    note: |
      Not multi-value per se — this exercises HuggingFace's namespaced
      tag columns (library_name, pipeline_tag, license_tag,
      language_tag). Model registry rows carry many single-token tag
      columns; combine them for population-scale slices. BERT, GPT-2,
      RoBERTa, distilBERT usually surface.

  - title: "USGS earthquakes near country polygons (bbox spatial)"
    datasets: [usgs-earthquakes, natural-earth-countries]
    kind: spatial
    hops: 1
    license: public-domain-ish
    semantic: true
    sql: |
      SELECT e.title, e.magnitude, ne.name AS country
      FROM usgs_earthquakes e
      JOIN natural_earth_countries ne USING PLACE
      WHERE e.magnitude >= 6.5 LIMIT 10
    note: |
      Rewrites to CROSS JOIN + WHERE bbox — a real spatial join. Note
      mesh phase-1 dispatch currently rejects range-only conditions
      ("at least one equijoin key"), so this query rewrites correctly
      but doesn't execute until phase-4b. Ships as a rewrite proof-of-
      concept — see docs/SEMANTIC_JOINS.md.
